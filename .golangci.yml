version: "2"

linters:
  default: standard
  enable:
    - contextcheck
    - durationcheck
    - errorlint
    - fatcontext
    - forcetypeassert
    - makezero
    - nilerr
  exclusions:
    paths:
      - node_modules

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - node_modules

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
