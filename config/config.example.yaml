# 默认配置示例文件, 此文件由单元测试生成, 请勿直接修改
# 复制此文件为 config.yaml 并根据需要修改

# pemcast agent configuration
agent:
  once: false # synchronize once and exit
  dry-run: false # validate changes without writing files or running hooks
  max-concurrent: 4 # maximum targets reconciled concurrently

  # named etcd clusters for a single-process multi-tenant agent
  etcds:
    - name: "default" # unique agent-local etcd name
      prefix: "/pemcast" # etcd namespace prefix placed before /v6

      # etcd endpoint URLs
      endpoints:
        - http://127.0.0.1:2379
      user: "" # etcd authentication as username:password; empty disables authentication
      dial-timeout: 5s # etcd connection timeout
      request-timeout: 10s # timeout for an etcd read

      # etcd TLS client configuration
      tls:
        ca-file: "" # PEM CA bundle used to verify etcd
        cert-file: "" # PEM client certificate used for etcd mTLS
        key-file: "" # PEM client private key used for etcd mTLS
        server-name: "" # expected etcd TLS server name
        insecure-skip-verify: false # skip etcd TLS server verification (unsafe)
      management-user: "" # optional username:password for management commands; environment fallback is used when empty

  # etcd watch and retry configuration
  watch:
    progress-interval: 30s # interval for requesting etcd watch progress
    progress-timeout: 2m0s # maximum time without a watch event or progress response
    retry-min: 1s # minimum snapshot/watch restart delay
    retry-max: 30s # maximum snapshot/watch restart delay
    jitter-ratio: 0.2 # random restart jitter ratio from zero to one

  # certificate synchronization targets
  targets:
    - id: "nginx" # target identifier and remote active-pointer name
      etcd: "default" # agent.etcds name owning this target
      type: "tls-server" # certificate bundle type: tls-server, tls-client, or trust
      delete-policy: "retain" # action when the active pointer is deleted: retain or fail

      # local release directory configuration
      output:
        root: "/etc/nginx/tls" # local certificate root directory

        # role-to-public-file overrides
        files:
          certificate-chain:
            name: "tls.crt" # public file name in the output root
            mode: "0644" # octal file mode

      # TLS material validation configuration
      validation:
        minimum-validity: 336h0m0s # minimum required remaining certificate validity

        # required DNS names or IP addresses for tls-server targets
        server-names: []

      # post-activation hook configuration
      hook:
        path: "/etc/pemcast/hooks/reload-nginx" # post-activation executable path

        # post-activation executable arguments
        args: []
        timeout: 30s # hook execution timeout

        # existing environment variable names explicitly passed to the hook
        pass-environment: []

# pemcast local command tools
tools:

  # local v6 pack builder configuration
  pack:
    type: "tls-server" # certificate bundle type: tls-server, tls-client, or trust
    target: "" # target ID
    certificate: "" # path to fullchain.pem
    private-key: "" # path to privkey.pem
    ca: "" # path to ca-bundle.pem for trust
    etcd-prefix: "/pemcast" # etcd namespace prefix placed before /v6
    output-dir: "" # new absolute directory for bundle.json, metadata.json, and stage.txn

  # local v6 release seeder configuration
  seed:
    target: "" # target ID from the agent configuration
    etcd: "" # agent.etcds name when multiple targets share an ID
    pack-dir: "" # directory containing bundle.json and metadata.json
    force: false # replace an existing different local release during an explicit rescue
